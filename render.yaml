services:
  - type: web
    name: vyra-v1
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: vyra-db
          property: connectionString
      - key: FLASK_DEBUG
        value: "false"

databases:
  - name: vyra-db
    plan: free